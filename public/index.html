<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#133f38" />
    <title>Paisa — Personal Finance</title>
    <meta
      name="description"
      content="A private, online personal finance tracker for INR."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23133f38'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='29' font-family='Arial' fill='%23d8f4a0'%3E₹%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #18332d;
        --muted: #71807b;
        --bg: #f3f6f4;
        --panel: #fff;
        --line: #dfe7e2;
        --forest: #143e37;
        --forest2: #235e50;
        --lime: #d9f5a7;
        --green: #4f856d;
        --red: #c35b54;
        --amber: #e4a950;
        --blue: #557f96;
        --shadow: 0 14px 44px rgba(24, 51, 45, 0.07);
        --r: 18px;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #8ebc7a66;
        outline-offset: 2px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 246px 1fr;
      }
      .sidebar {
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 28px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 11px 28px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1.4px;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--forest);
        color: var(--lime);
        font-size: 26px;
        font-weight: 400;
      }
      .brand b {
        color: #8fbc61;
      }
      .nav-label {
        padding: 9px 13px;
        color: #9ba8a2;
        font-size: 11px;
        letter-spacing: 1.4px;
        font-weight: 700;
      }
      .nav {
        display: grid;
        gap: 7px;
      }
      .nav button {
        border: 0;
        background: transparent;
        color: #66746e;
        border-radius: 11px;
        padding: 12px 13px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        position: relative;
      }
      .nav button:hover {
        background: #f2f6f2;
      }
      .nav button.active {
        background: #eaf3e5;
        color: #264f3d;
        font-weight: 700;
      }
      .nav button.active:after {
        content: "";
        position: absolute;
        right: 12px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6d9b51;
      }
      .nav svg {
        width: 19px;
        height: 19px;
      }
      .side-foot {
        margin-top: auto;
      }
      .privacy {
        background: #f5f8f5;
        border: 1px solid #e6ece7;
        border-radius: 14px;
        padding: 14px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .privacy svg {
        color: #58814c;
      }
      .privacy strong {
        font-size: 12px;
        display: block;
      }
      .privacy span {
        font-size: 11px;
        color: var(--muted);
      }
      .main {
        min-width: 0;
      }
      .topbar {
        height: 70px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 34px;
        position: sticky;
        top: 0;
        z-index: 15;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #81908a;
        font-size: 13px;
      }
      .menu-btn {
        display: none;
        border: 0;
        background: transparent;
        padding: 8px;
      }
      .local-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        border: 1px solid #dfe9df;
        border-radius: 99px;
        color: #54705d;
        font-size: 12px;
        background: #f9fbf8;
      }
      .local-pill i {
        width: 7px;
        height: 7px;
        background: #77a95b;
        border-radius: 50%;
      }
      .content {
        max-width: 1500px;
        margin: auto;
        padding: 34px 36px 90px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 27px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.6px;
        color: #78867f;
        font-weight: 800;
      }
      .page-head h1 {
        font-size: 34px;
        line-height: 1.2;
        letter-spacing: -1.2px;
        margin: 5px 0;
      }
      .page-head p {
        color: var(--muted);
      }
      .btn {
        border: 0;
        border-radius: 11px;
        padding: 11px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 700;
        color: var(--ink);
        background: #eef3ef;
        min-height: 43px;
      }
      .btn:hover {
        filter: brightness(0.97);
      }
      .btn-primary {
        background: var(--forest);
        color: #fff;
        box-shadow: 0 8px 20px rgba(20, 62, 55, 0.16);
      }
      .btn-outline {
        background: #fff;
        border: 1px solid var(--line);
      }
      .btn-danger {
        background: #a94741;
        color: white;
      }
      .btn-icon {
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--line);
        background: #fff;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(330px, 0.75fr);
        gap: 20px;
        margin-bottom: 20px;
      }
      .balance-card {
        background:
          radial-gradient(circle at 90% 15%, #397664 0, transparent 34%),
          linear-gradient(135deg, #153f37, #18372f);
        color: white;
        border-radius: 22px;
        padding: 28px;
        min-height: 225px;
        box-shadow: 0 18px 50px rgba(20, 62, 55, 0.18);
        position: relative;
        overflow: hidden;
      }
      .balance-card:after {
        content: "₹";
        position: absolute;
        right: 25px;
        bottom: -54px;
        font-size: 190px;
        color: #fff08;
        font-weight: 600;
      }
      .balance-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .balance-label {
        font-size: 13px;
        color: #c7d9d0;
        display: block;
      }
      .balance-card h2 {
        font-size: 42px;
        letter-spacing: -1.8px;
        margin: 16px 0 7px;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .balance-card p {
        font-size: 12px;
        color: #a8c0b6;
      }
      .balance-bottom {
        position: absolute;
        bottom: 25px;
        left: 28px;
        display: flex;
        gap: 28px;
      }
      .mini-metric span {
        display: block;
        font-size: 11px;
        color: #9fb9ae;
      }
      .mini-metric strong {
        display: block;
        margin-top: 3px;
        font-size: 14px;
      }
      .mini-metric.positive strong {
        color: var(--lime);
      }
      .period-control select,
      .control {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 10px 12px;
        color: var(--ink);
        min-height: 42px;
      }
      .period-control select {
        background: #ffffff12;
        color: white;
        border-color: #ffffff30;
      }
      .period-control option {
        color: #18332d;
      }
      .summary-stack {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px;
      }
      .metric-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 30px rgba(24, 51, 45, 0.035);
      }
      .metric-card:first-child {
        grid-column: 1/-1;
      }
      .metric-top {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }
      .metric-icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #edf5e8;
        color: #60884d;
      }
      .metric-icon.out {
        background: #fbf0e7;
        color: #aa7247;
      }
      .metric-card strong {
        display: block;
        font-size: 25px;
        letter-spacing: -0.7px;
        margin: 15px 0 5px;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .metric-card small {
        color: #8c9893;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .section-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.85fr);
        gap: 20px;
        margin-bottom: 20px;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 21px 23px 14px;
      }
      .panel-head h2 {
        font-size: 17px;
      }
      .panel-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .link-btn {
        border: 0;
        background: transparent;
        color: #477257;
        font-weight: 700;
        font-size: 12px;
      }
      .chart-wrap {
        height: 245px;
        padding: 5px 19px 18px;
      }
      .chart-wrap svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .chart-grid-line {
        stroke: #e9efeb;
        stroke-width: 1;
      }
      .chart-label {
        font-size: 10px;
        fill: #7d8c85;
      }
      .bar-income {
        fill: #255e50;
      }
      .bar-expense {
        fill: #b9dc8c;
      }
      .legend {
        display: flex;
        gap: 13px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend span {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
        background: #255e50;
      }
      .dot.expense {
        background: #b9dc8c;
      }
      .donut-area {
        display: grid;
        place-items: center;
        padding: 4px 20px 18px;
      }
      .donut {
        width: 178px;
        height: 178px;
        border-radius: 50%;
        position: relative;
      }
      .donut:after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: 50%;
        background: #fff;
      }
      .donut-center {
        position: absolute;
        z-index: 2;
        text-align: center;
      }
      .donut-center span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .donut-center strong {
        display: block;
        font-size: 20px;
        margin-top: 3px;
      }
      .category-list {
        width: 100%;
        margin-top: 16px;
        display: grid;
        gap: 10px;
      }
      .category-row {
        display: grid;
        grid-template-columns: 1fr auto 35px;
        gap: 9px;
        align-items: center;
        font-size: 12px;
      }
      .category-name {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 3px;
      }
      .category-row small {
        text-align: right;
        color: #8c9893;
      }
      .table-scroll {
        overflow: auto;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        min-width: 700px;
      }
      .data-table th {
        background: #f8faf8;
        color: #7a8882;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: left;
        padding: 12px 20px;
        border-top: 1px solid #edf1ee;
        border-bottom: 1px solid #edf1ee;
      }
      .data-table td {
        padding: 14px 20px;
        border-bottom: 1px solid #edf1ee;
        font-size: 13px;
      }
      .data-table tr:last-child td {
        border-bottom: 0;
      }
      .right {
        text-align: right !important;
      }
      .tx-name {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 180px;
      }
      .tx-icon {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: #eff5e9;
        color: #61854e;
      }
      .tx-icon.expense {
        background: #f9f1e9;
        color: #a47d50;
      }
      .tx-name strong {
        display: block;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tx-name small {
        display: block;
        color: #8a9691;
        margin-top: 2px;
      }
      .amount {
        font-weight: 800;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .income-text {
        color: #4c7d57;
      }
      .row-actions {
        display: flex;
        justify-content: flex-end;
        gap: 5px;
      }
      .row-actions button {
        border: 0;
        background: transparent;
        color: #74817b;
        padding: 7px;
        border-radius: 8px;
      }
      .row-actions button:hover {
        background: #edf2ee;
        color: #315b48;
      }
      .empty {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 52px 20px;
      }
      .empty-icon {
        width: 56px;
        height: 56px;
        border-radius: 17px;
        background: #eef5e9;
        display: grid;
        place-items: center;
        color: #64894f;
        margin-bottom: 14px;
      }
      .empty h3 {
        font-size: 17px;
      }
      .empty p {
        max-width: 390px;
        color: var(--muted);
        margin: 7px auto 18px;
      }
      .toolbar {
        display: flex;
        align-items: end;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid #edf1ee;
        flex-wrap: wrap;
      }
      .search {
        position: relative;
        flex: 1;
        min-width: 240px;
      }
      .search svg {
        position: absolute;
        left: 12px;
        top: 12px;
        color: #87938e;
      }
      .search input {
        padding-left: 39px;
      }
      .field {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 700;
        color: #53635c;
      }
      .field input,
      .field select,
      .field textarea {
        border: 1px solid #dbe4de;
        border-radius: 10px;
        padding: 11px 12px;
        background: #fff;
        color: var(--ink);
        min-width: 0;
        width: 100%;
      }
      .field textarea {
        min-height: 80px;
        resize: vertical;
      }
      .field small {
        font-weight: 400;
        color: var(--muted);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
      }
      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--forest);
      }
      .toolbar .field {
        min-width: 145px;
      }
      .count-label {
        padding: 12px 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .account-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .account-card {
        background: linear-gradient(140deg, #173e37, #286052);
        color: white;
        border-radius: 18px;
        padding: 23px;
        min-height: 220px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 13px 35px rgba(28, 66, 55, 0.14);
      }
      .account-card:nth-child(3n + 2) {
        background: linear-gradient(140deg, #385964, #547988);
      }
      .account-card:nth-child(3n + 3) {
        background: linear-gradient(140deg, #665a40, #847553);
      }
      .account-card:after {
        content: "";
        position: absolute;
        width: 170px;
        height: 170px;
        border: 1px solid #ffffff17;
        border-radius: 50%;
        right: -65px;
        top: -70px;
        pointer-events: none;
      }
      .account-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #d5e2dc;
        font-size: 12px;
      }
      .account-icon {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        border: 1px solid #ffffff2c;
        display: grid;
        place-items: center;
      }
      .account-card h3 {
        font-size: 16px;
        margin-top: 25px;
        color: #dce8e2;
      }
      .account-card > strong {
        font-size: 30px;
        display: block;
        margin-top: 8px;
        letter-spacing: -0.8px;
        overflow-wrap: anywhere;
      }
      .account-card > p {
        font-size: 11px;
        color: #b9cbc2;
      }
      .account-card footer {
        position: absolute;
        left: 23px;
        right: 23px;
        bottom: 20px;
        padding-top: 14px;
        border-top: 1px solid #ffffff24;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #c4d3cc;
      }
      .account-menu {
        border: 0;
        background: #ffffff16;
        color: #fff;
        border-radius: 8px;
        padding: 6px;
        position: relative;
        z-index: 2;
      }

      .balance-amount-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .balance-eye {
        position: relative;
        z-index: 2;
        width: 38px;
        height: 38px;
        border: 1px solid #ffffff35;
        border-radius: 11px;
        background: #ffffff12;
        color: white;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .balance-eye svg {
        width: 19px;
        height: 19px;
      }
      .description-cell {
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #60706a;
      }
      .import-panel {
        padding: 4px 25px 25px;
        display: grid;
        gap: 18px;
      }
      .import-step {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 12px;
      }
      .import-step b {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #eaf3e5;
        color: #315b48;
      }
      .mapping-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }
      .preview-table {
        max-height: 260px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .preview-table table {
        min-width: 640px;
      }
      .preview-table th,
      .preview-table td {
        padding: 9px 12px;
        font-size: 11px;
      }
      .import-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .import-summary div {
        padding: 14px;
        border-radius: 12px;
        background: #f4f7f3;
      }
      .import-summary strong {
        display: block;
        font-size: 23px;
      }
      .import-summary span {
        color: var(--muted);
        font-size: 11px;
      }
      .error-list {
        max-height: 180px;
        overflow: auto;
        margin: 0;
        padding-left: 22px;
        color: #98453f;
        font-size: 12px;
      }
      .report-filters {
        display: flex;
        align-items: end;
        gap: 12px;
        margin-bottom: 19px;
        flex-wrap: wrap;
      }
      .report-filters .field {
        min-width: 180px;
      }
      .report-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
      }
      .report-card {
        padding: 20px;
        border-radius: 15px;
        background: #fff;
        border: 1px solid var(--line);
      }
      .report-card span {
        color: var(--muted);
        font-size: 12px;
      }
      .report-card strong {
        display: block;
        font-size: 27px;
        margin-top: 8px;
      }
      .planning-head {
        display: flex;
        align-items: center;

      function parseAmount(v, { signed = false } = {}) {
        const s = String(v).trim();
        const re = signed ? /^-?\d+(\.\d{1,2})?$/ : /^\d+(\.\d{1,2})?$/;
        if (!re.test(s))
          throw Error("Enter a valid amount with up to two decimal places.");
        const n = Math.round(Number(s) * 100);
        if (
          !Number.isSafeInteger(n) ||
          Math.abs(n) > 1e12 ||

        const amount = Math.round(Number(s) * 100);

        async request(method, path, body) {

            method,
            headers: {
              "Content-Type": "application/json",
            },
            ...(body === undefined ? {} : { body: JSON.stringify(body) }),
          });
          const type = response.headers.get("content-type") || "";
          const payload = type.includes("application/json")
            ? await response.json()
            : { error: await response.text() };
          if (!response.ok) {
            const error = Error(
              payload.error || `Request failed (${response.status}).`,
            );
            error.status = response.status;
            if (
              response.status === 401 &&
              path !== "/api/auth" &&
              !state.authRequired
            ) {
              await requestAuthentication(error.message);
              return this.request(method, path, body);
            }
            throw error;

          return payload;
        }

        }

backup">↓ Download complete backup</button><button class="btn btn-outline" data-action="restore">↑ Restore from backup</button><button class="btn btn-outline" data-action="export-all-csv">↓ Export all transactions as CSV</button><button class="btn btn-outline" data-action="logout">Log out</button></div></section><section class="panel"><div class="panel-head"><div><h2>Categories</h2><p>Default and custom labels</p></div><button class="btn btn-outline" data-action="add-category">＋ Add</button></div><div class="chip-list">${cats.map((c) => `<span class="chip">${esc(c)}${DEFAULT_CATEGORIES.includes(c) ? "" : `<button data-action="edit-category" data-name="${esc(c)}">✎</button><button data-action="delete-category" data-name="${esc(c)}">×</button>`}</span>`).join("")}</div></section><section class="panel danger-zone"><div class="panel-head"><div><h2>Delete finance data</h2><p>Remove all financial records from your account</p></div></div><div class="backup-actions"><button class="btn btn-danger" data-action="reset">Delete my finance data</button></div></section></div>`;

      function monthOptions(selected) {
        let out = "";
        const now = new Date();
        for (let i = 0; i < 36; i++) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1),
            v = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
          out += `<option value="${v}" ${v === selected ? "selected" : ""}>${d.toLocaleDateString("en-IN", { month: "short", year: "numeric" })}</option>`;
        }
        return out;
      }

      function normalizedHeader(value) {

      function autoMap(headers, keys) {
        const aliases = {
          date: ["date", "transactiondate", "valuedate", "posteddate"],
          description: [
            "description",
            "narration",
            "details",
            "remarks",
            "memo",
            "notes",

          amount: ["amount", "transactionamount", "value"],

          credit: ["credit", "creditamount", "deposit", "depositamount"],
          category: ["category", "transactioncategory"],
          paymentType: ["paymenttype", "paymentmode", "modeofpayment", "mode"],
        };
        const result = {};
        for (const key of keys) {
          const index = headers.findIndex((h) =>
            aliases[key].includes(normalizedHeader(h)),

      function importDate(value) {
        if (value instanceof Date && Number.isFinite(value.getTime()))
          return value.toISOString().slice(0, 10);
        const s = String(value ?? "").trim();
        if (validDate(s)) return s;
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return "";
        if (/^\d{1,2}[\/-]\d{1,2}[\/-]\d{4}$/.test(s)) {
          const [d, m, y] = s.split(/[\/-]/).map(Number);
          const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          if (validDate(iso)) return iso;
        }
        if (/^\d+(\.\d+)?$/.test(s) && window.XLSX?.SSF) {
          const x = XLSX.SSF.parse_date_code(Number(s));
          if (x) {
            const iso = `${x.y}-${String(x.m).padStart(2, "0")}-${String(x.d).padStart(2, "0")}`;
            if (validDate(iso)) return iso;
          }
        }
        const d = new Date(s);
        return Number.isFinite(d.getTime()) ? d.toISOString().slice(0, 10) : "";

      function importedMoney(value) {
        let s = String(value ?? "").trim();
        if (!s) return 0;
        const negative = /^\(.*\)$/.test(s) || s.startsWith("-");
        s = s
          .replace(/[₹,$()\s]/g, "")
          .replace(/,/g, "")
          .replace(/^-/, "");
        if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
        const amount = Math.round(Number(s) * 100);
        return negative ? -amount : amount;
      }
      function importType(value) {

      function transactionFingerprint(t) {

      async function processImport(event) {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector(".btn-primary");
        const mapping = {};
        $$("[data-map]", form).forEach(
          (x) => (mapping[x.dataset.map] = x.value),
        );
        const defaultAccountId = $("#import-default-account").value;
        const hasAmount = mapping.amount !== "";
        const hasDebitCredit = mapping.debit !== "" || mapping.credit !== "";
        if (mapping.date === "") return showError("Map a Date column.");
        if (!hasAmount && !hasDebitCredit)
          return showError("Map Amount, or map Debit and/or Credit values.");
        if (state.importKind === "feed" && !defaultAccountId)
          return showError("Choose the account for this account feed.");
        if (hasAmount && mapping.type === "")
          return showError(
            "When using one Amount column, also map the Income / Expense Type column.",
          );
        button.disabled = true;
        const errors = [],
          candidates = [],
          existing = new Set(state.transactions.map(transactionFingerprint)),
          seen = new Set(),
          customCategories = new Set(state.categories.map((x) => x.name));
        let duplicates = 0;
        const value = (row, key) =>
          mapping[key] === "" ? "" : row[Number(mapping[key])];
        state.importRows.forEach((row, index) => {
          try {
            const date = importDate(value(row, "date"));
            if (!date) throw Error("invalid date");
            const description = String(value(row, "description") ?? "").trim();
            if (description.length > 500)
              throw Error("description exceeds 500 characters");
            const accountName = String(value(row, "account") ?? "").trim();
            const account = accountName
              ? state.accounts.find(
                  (a) => a.name.toLowerCase() === accountName.toLowerCase(),
                )
              : state.accounts.find((a) => a.id === defaultAccountId);
            if (!account)
              throw Error(
                accountName
                  ? `account “${accountName}” does not exist`
                  : "account is missing",
              );
            let type = "",
              amount = 0;
            const debit = importedMoney(value(row, "debit")),
              credit = importedMoney(value(row, "credit"));
            if (Number.isNaN(debit) || Number.isNaN(credit))
              throw Error("invalid debit or credit value");
            if (credit && debit)
              throw Error("both debit and credit contain values");
            if (credit) {
              type = "income";
              amount = Math.abs(credit);
            } else if (debit) {
              type = "expense";
              amount = Math.abs(debit);
            } else if (hasAmount) {
              const rawAmount = importedMoney(value(row, "amount"));
              if (!Number.isFinite(rawAmount) || rawAmount === 0)
                throw Error("invalid or zero amount");
              type = importType(value(row, "type"));
              if (!type) throw Error("invalid income / expense type");
              amount = Math.abs(rawAmount);
            } else throw Error("debit, credit or amount is required");
            const category =

            const record = {

              type,
              amount,
              date,
              category: category.slice(0, 40),
              accountId: account.id,
              paymentType: normalizePaymentType(value(row, "paymentType")),
              description,
              notes: description,
              createdAt: Date.now() + index,
              updatedAt: Date.now(),
              importSource: state.importFileName,
            };
            const fingerprint = transactionFingerprint(record);
            if (existing.has(fingerprint) || seen.has(fingerprint)) {
              duplicates++;
              return;
            }
            seen.add(fingerprint);
            candidates.push(record);
            if (!DEFAULT_CATEGORIES.includes(record.category))
              customCategories.add(record.category);
          } catch (error) {
            errors.push(`Row ${index + 2}: ${error.message}`);

          await refresh();
          showImportSummary(

            errors,
          );
        } catch (error) {
          showError(`Import could not be completed: ${error.message}`);
          button.disabled = false;
        }
      }

        openModal(

          `<div class="import-panel"><div class="import-summary"><div><strong>${imported}</strong><span>Imported</span></div><div><strong>${duplicates}</strong><span>Duplicates skipped</span></div><div><strong>${errors.length}</strong><span>Invalid rows</span></div></div>${

                  .join(
                    "",
                  )}</ol>${errors.length > 100 ? `<p class="muted">Showing the first 100 of ${errors.length} errors.</p>` : ""}</div>`
              : '<div class="notice">Every valid row was imported successfully.</div>'
          }<div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Done</button></div></div>`,
        );
      }
      function csv(rows) {
        const header = [
          "Type",
          "Amount INR",
          "Date",
          "Category",
          "Account",
          "Payment Type",
          "Description",
        ];
        const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
        return [
          header,
          ...rows.map((t) => [
            t.type,
            (t.amount / 100).toFixed(2),
            t.date,
            t.category,
            state.accounts.find((a) => a.id === t.accountId)?.name || "",
            t.paymentType || "UPI/Cash",
            t.description ?? t.notes ?? "",
          ]),
        ]
          .map((r) => r.map(q).join(","))
          .join("\r\n");
      }
      function download(name, data, type) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([data], { type }));
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 500);
      }
      function addVerifiedEmail() {
        openModal(
          "Add verified email",
          "A six-digit verification code will be sent to this address.",
          `<form class="modal-form" id="email-form"><label class="field">Email<input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></label><div class="form-error"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary">Send code</button></div></form>`,
        );
        $("#email-form").onsubmit = async (event) => {
          event.preventDefault();
          const button = event.target.querySelector(".btn-primary");
          button.disabled = true;
          try {
            const started = await db.auth("email_begin", {
              email: String(new FormData(event.target).get("email") || ""),
            });
            openModal(
              "Verify your email",
              `Enter the code sent to ${started.email}.`,
              `<form class="modal-form" id="email-code-form"><label class="field">Six-digit code<input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456"></label><div class="form-error"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary">Verify</button></div></form>`,
            );
            $("#email-code-form").onsubmit = async (codeEvent) => {
              codeEvent.preventDefault();
              const verifyButton = codeEvent.target.querySelector(".btn-primary");
              verifyButton.disabled = true;
              try {
                const verified = await db.auth("email_confirm", {
                  challenge: started.challenge,
                  code: String(
                    new FormData(codeEvent.target).get("code") || "",
                  ),
                });
                state.user.email = verified.email;
                state.user.emailVerified = true;
                closeModal();
                render();
                toast("Email verified.");
              } catch (error) {
                showError(error.message);
                verifyButton.disabled = false;
              }
            };
          } catch (error) {
            showError(error.message);
            button.disabled = false;
          }
        };
      }
      function changePassword() {
        openModal(
          "Change password",
          "Your other signed-in sessions will be ended.",
          `<form class="modal-form" id="password-form"><label class="field">Current password<input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label><label class="field">New password<input name="newPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="At least 10 characters"></label><label class="field">Confirm new password<input name="confirmPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><div class="form-error"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary">Change password</button></div></form>`,
        );
        $("#password-form").onsubmit = async (event) => {
          event.preventDefault();
          const values = new FormData(event.target);
          const newPassword = String(values.get("newPassword") || "");
          if (newPassword !== String(values.get("confirmPassword") || "")) {
            return showError("Passwords do not match.");
          }
          const button = event.target.querySelector(".btn-primary");
          button.disabled = true;
          try {
            await db.auth("password_change", {
              currentPassword: String(values.get("currentPassword") || ""),
              newPassword,
            });
            closeModal();
            toast("Password changed. Other sessions were signed out.");
          } catch (error) {
            showError(error.message);
            button.disabled = false;
          }
        };
      }
      function setupTotp() {
        const replacing = Boolean(state.user?.totpEnabled);
        openModal(
          replacing ? "Re-enroll authenticator" : "Enable authenticator app",
          "Confirm your password before generating a new setup key.",
          `<form class="modal-form" id="totp-password-form"><label class="field">Current password<input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label><div class="form-error"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary">Continue</button></div></form>`,
        );
        $("#totp-password-form").onsubmit = async (passwordEvent) => {
          passwordEvent.preventDefault();
          const button = passwordEvent.target.querySelector(".btn-primary");
          button.disabled = true;
          try {
            const setup = await db.auth("totp_begin", {
              currentPassword: String(
                new FormData(passwordEvent.target).get("currentPassword") || "",
              ),
            });
            openModal(
              replacing ? "Scan the new QR code" : "Scan the QR code",
              "Use Google Authenticator, Microsoft Authenticator, Authy, or another TOTP app.",
              `<form class="modal-form" id="totp-form"><div class="qr-setup"><img src="${esc(setup.qrDataUrl)}" width="240" height="240" alt="Authenticator setup QR code"><div class="notice"><strong>Manual setup key</strong><code>${esc(setup.secret)}</code></div></div><label class="field">Six-digit code<input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456"></label><div class="form-error"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary">Confirm ${replacing ? "new authenticator" : "and enable"}</button></div></form>`,
            );
            $("#totp-form").onsubmit = async (event) => {
              event.preventDefault();
              const confirmButton = event.target.querySelector(".btn-primary");
              confirmButton.disabled = true;
              try {
                const result = await db.auth("totp_confirm", {
                  code: String(new FormData(event.target).get("code") || ""),
                });
                state.user.totpEnabled = true;
                openModal(
                  "Save your recovery codes",
                  "These replace any previous recovery codes. Each works once.",
                  `<div class="notice"><code style="white-space:pre-wrap;font-size:16px;line-height:1.8">${result.backupCodes.map(esc).join("\n")}</code></div><div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">I saved them</button></div>`,
                );
                render();
              } catch (error) {
                showError(error.message);
                confirmButton.disabled = false;
              }
            };
          } catch (error) {
            showError(error.message);
            button.disabled = false;
          }
        };
      }
      function disableTotp() {
        openModal(
          "Disable authenticator verification?",
          "Confirm with your password and a current authenticator or recovery code.",
          `<form class="modal-form" id="disable-totp-form"><label class="field">Current password<input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label><label class="field">Authenticator or recovery code<input name="code" required maxlength="11" autocomplete="one-time-code" placeholder="123456 or recovery code"></label><div class="form-error"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-danger">Disable 2FA</button></div></form>`,
        );
        $("#disable-totp-form").onsubmit = async (event) => {
          event.preventDefault();
          const values = new FormData(event.target);
          const button = event.target.querySelector(".btn-danger");
          button.disabled = true;
          try {
            await db.auth("totp_disable", {
              currentPassword: String(values.get("currentPassword") || ""),
              code: String(values.get("code") || "").trim(),
            });
            state.user.totpEnabled = false;
            closeModal();
            render();
            toast("Authenticator verification disabled.");
          } catch (error) {
            showError(error.message);
            button.disabled = false;
          }
        };
      }
      async function handle(action, id, el) {
        if (action === "add-tx") txModal();
        if (action === "edit-tx") txModal(id);
        if (action === "toggle-balance") {
          state.balanceVisible = !state.balanceVisible;
          render();
        }
        if (action === "import") openImportStart();
        if (action === "logout") {
          await db.auth("logout");
          location.reload();
        }
        if (action === "change-password") changePassword();
        if (action === "setup-totp") setupTotp();
        if (action === "disable-totp") disableTotp();
        if (action === "add-email") addVerifiedEmail();
        if (action === "add-account") accountModal();
        if (action === "edit-account") accountModal(id);
        if (action === "add-category") categoryModal();
        if (action === "edit-category") categoryModal(el.dataset.name);
        if (action === "plan-tab") {
          state.planTab = id;
          render();
        }
        if (action === "add-budgets") budgetModal();
        if (action === "edit-budget") budgetModal(id);
        if (action === "add-recurring") recurringModal();
        if (action === "edit-recurring") recurringModal(id);
        if (action === "add-goals") goalModal();
        if (action === "edit-goal") goalModal(id);
        if (action === "add-loans") loanModal();
        if (action === "edit-loan") loanModal(id);
        if (action === "close-modal") closeModal();
        const planningDelete = {
          "delete-budget": ["budgets", "Budget"],
          "delete-recurring": ["recurring", "Recurring entry"],
          "delete-goal": ["goals", "Goal"],
          "delete-loan": ["loans", "Loan"],
        }[action];
        if (planningDelete) {
          const [collection, label] = planningDelete;
          confirmModal(
            `Delete ${label.toLowerCase()}?`,
            `${label} will be permanently removed. Existing transactions are not changed.`,
            `Delete ${label.toLowerCase()}`,
            async () => {
              await db.del(collection, id);
              toast(`${label} deleted.`);
            },
          );
        }
        if (action === "delete-tx") {
          const t = state.transactions.find((x) => x.id === id);
          confirmModal(
            "Delete transaction?",
            `${money(t.amount)} · ${t.description || t.notes || t.category} will be removed. The account balance will update immediately.`,
            "Delete transaction",
            async () => {
              await db.del("transactions", id);
              toast("Transaction deleted.");
            },
          );
        }
        if (action === "delete-account") {
          const a = state.accounts.find((x) => x.id === id),
            count = state.transactions.filter((t) => t.accountId === id).length;
          confirmModal(
            "Delete account?",
            `${a.name} and ${count} linked ${count === 1 ? "transaction" : "transactions"} will be permanently removed.`,
            "Delete account",
            async () => {
              for (const t of state.transactions.filter(
                (x) => x.accountId === id,
              ))
                await db.del("transactions", t.id);
              await db.del("accounts", id);
              toast("Account deleted.");
            },
          );
        }
        if (action === "delete-category") {
          const name = el.dataset.name,
            count = [
              ...state.transactions,
              ...state.recurring,
              ...state.budgets,
            ].filter((t) => t.category === name).length;
          if (count)
            return toast(
              `This category is used by ${count} transaction${count === 1 ? "" : "s"}. Rename it instead.`,
              "error",
            );
          confirmModal(
            "Delete category?",
            `${name} will be removed from your custom categories.`,
            "Delete category",
            async () => {
              const c = state.categories.find((x) => x.name === name);
              await db.del("categories", c.id);
              toast("Category deleted.");
            },
          );
        }
        if (action === "report-month") {
          state.report = { from: monthStart(), to: istToday() };
          render();
        }
        if (action === "export-csv") {
          const r = state.transactions.filter(
            (t) => t.date >= state.report.from && t.date <= state.report.to,
          );
          download(
            `paisa-transactions-${state.report.from}-to-${state.report.to}.csv`,
            csv(r),
            "text/csv",
          );
        }
        if (action === "export-all-csv")
          download(
            `paisa-transactions-${istToday()}.csv`,
            csv(state.transactions),
            "text/csv",
          );
        if (action === "backup") {
          download(
            `paisa-backup-${istToday()}.json`,
            JSON.stringify(
              {
                format: "paisa-backup",
                version: 2,
                exportedAt: new Date().toISOString(),
                accounts: state.accounts,
                transactions: state.transactions,
                categories: state.categories,
                budgets: state.budgets,
                recurring: state.recurring,
                goals: state.goals,
                loans: state.loans,
              },
              null,
              2,
            ),
            "application/json",
          );
          toast("Backup downloaded.");
        }
        if (action === "restore") $("#restore-file").click();
        if (action === "reset")
          confirmModal(
            "Delete all cloud data?",
            "This removes every financial and planning record from the database. Download a backup first if you may need it.",
            "Delete everything",
            async () => {
              await db.clear("transactions");
              await db.clear("categories");
              await db.clear("budgets");
              await db.clear("recurring");
              await db.clear("goals");
              await db.clear("loans");
              await db.clear("accounts");
              toast("Cloud data reset.");
            },
          );
      }
      document.addEventListener("click", (e) => {
        const v = e.target.closest("[data-view]");
        if (v) {
          state.view = v.dataset.view;
          render();
          return;
        }
        const a = e.target.closest("[data-action]");
        if (a) handle(a.dataset.action, a.dataset.id, a);
      });
      $("#modal-layer").addEventListener("click", (e) => {
        if (e.target === $("#modal-layer")) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
      $("#import-file").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          if (!/\.(csv|xls|xlsx)$/i.test(file.name))
            throw Error("Choose a CSV, XLS or XLSX file.");
          if (file.size > 20 * 1024 * 1024)
            throw Error("The import file must be 20 MB or smaller.");
          if (!window.XLSX)
            throw Error("The spreadsheet parser is unavailable.");
          const workbook = XLSX.read(await file.arrayBuffer(), {
            type: "array",
            cellDates: true,
          });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const matrix = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            defval: "",
            raw: false,
            dateNF: "yyyy-mm-dd",
          });
          if (matrix.length < 2)
            throw Error(
              "The file needs a header row and at least one data row.",
            );
          const used = new Map();
          state.importHeaders = matrix[0].map((value, index) => {
            const base = String(value || `Column ${index + 1}`).trim();
            const count = (used.get(base) || 0) + 1;
            used.set(base, count);
            return count === 1 ? base : `${base} (${count})`;
          });
          state.importRows = matrix
            .slice(1)
            .filter((row) => row.some((value) => String(value).trim() !== ""));
          if (!state.importRows.length) throw Error("No data rows were found.");
          if (state.importRows.length > 2000)
            throw Error("A single import can contain up to 2,000 rows.");
          state.importFileName = file.name;
          showImportMapping();
        } catch (error) {
          toast(error.message, "error");
        } finally {
          e.target.value = "";
        }
      };
      $("#restore-file").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const d = JSON.parse(await file.text());
          if (
            d.format !== "paisa-backup" ||
            ![1, 2].includes(d.version) ||
            !Array.isArray(d.accounts) ||
            !Array.isArray(d.transactions) ||
            !Array.isArray(d.categories)
          )
            throw Error("This is not a valid Paisa backup.");
          d.budgets ||= [];
          d.recurring ||= [];
          d.goals ||= [];
          d.loans ||= [];
          for (const a of d.accounts) {
            if (!a.id || !a.name || !Number.isSafeInteger(a.opening))
              throw Error("The backup contains an invalid account.");
          }
          for (const t of d.transactions) {
            if (
              !t.id ||
              !["income", "expense"].includes(t.type) ||
              !Number.isSafeInteger(t.amount) ||
              t.amount <= 0 ||
              !validDate(t.date) ||
              !d.accounts.some((a) => a.id === t.accountId)
            )
              throw Error("The backup contains an invalid transaction.");
          }
          confirmModal(
            "Replace cloud data?",
            `This backup contains ${d.accounts.length} accounts and ${d.transactions.length} transactions. Your current cloud data will be replaced.`,
            "Restore backup",
            async () => {
              await db.replaceAll(d);
              toast("Backup restored.");
            },
          );
        } catch (err) {
          toast(err.message, "error");
        } finally {
          e.target.value = "";
        }
      };
      (async () => {
        try {
          await db.open();
          await refresh();
        } catch (e) {
          $("#view").innerHTML =
            `<div class="notice"><strong>Online database unavailable.</strong><br>${esc(e.message)}</div>`;
          nav();
          headings();
        }
      })();
    </script>
  </body>
</html>
